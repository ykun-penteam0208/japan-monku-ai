<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>47都道府県・激辛文句グループチャット</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #120101;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* 滴り落ちる血のダークレッド背景アニメーション */
        .blood-bg {
            background: linear-gradient(180deg, #120101 0%, #2b0404 50%, #0d0101 100%);
            position: relative;
            overflow: hidden;
        }
        .blood-bg::before {
            content: "";
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 200%;
            background-image: 
                radial-gradient(circle, rgba(160, 5, 5, 0.45) 15%, transparent 20%),
                radial-gradient(circle, rgba(100, 2, 2, 0.6) 15%, transparent 20%),
                linear-gradient(180deg, transparent 75%, rgba(200, 0, 0, 0.25) 100%);
            background-size: 50px 100px, 80px 160px, 100% 100%;
            animation: bloodDrip 9s linear infinite;
            pointer-events: none;
            opacity: 0.85;
        }
        @keyframes bloodDrip {
            0% { transform: translateY(0); }
            100% { transform: translateY(50%); }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 0, 0, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #990000;
            border-radius: 3px;
        }
    </style>
</head>

                </h1>

    <!-- チャット表示メイン領域 -->

        <div class="flex justify-center my-2 relative z-10">

    </div>

    <!-- フッター入力フォーム -->

            <button id="removeImageBtn" class="absolute -top-2 -right-2 bg-red-600 hover:bg-red-700 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow">

        </div>

        <form id="chatForm" class="flex items-center space-x-2">

    <!-- カスタムモーダル（alert代替） -->

        <div class="bg-[#3b0808] border border-red-700 rounded-2xl p-6 w-11/12 max-w-sm shadow-2xl text-white space-y-4 text-center">

            <p id="modalMessage" class="text-sm text-red-100"></p>
            <button id="modalCloseBtn" class="bg-red-700 hover:bg-red-600 px-5 py-2 rounded-xl text-sm font-bold shadow transition w-full">OK</button>
        </div>

            { id: "tottori", name: "鳥取県", dialect: "〜だで・砂丘に埋めるぞ", color: "#d97706", icon: "🐫" },
            { id: "shimane", name: "島根県", dialect: "〜だわ・何考えとるだか", color: "#2563eb", icon: "⛩️" },
            { id: "okayama", name: "岡山県", dialect: "〜じゃが・きびだんごぶつけるぞ", color: "#7c3aed", icon: "🍑" },
            { id: "hiroshima", name: "広島県", dialect: "〜じゃろ・ボケが", color: "#dc2626", icon: "⛩️" },
            { id: "yamaguchi", name: "山口県", dialect: "〜じゃっちゃ・ふざけとるんか", color: "#059669", icon: "🐡" },
            { id: "tokushima", name: "徳島県", dialect: "〜でよ・阿呆踊りで吹き飛ばすぞ", color: "#0284c7", icon: "🌊" },
            { id: "kagawa", name: "香川県", dialect: "〜じゃろ・うどんこね回すぞ", color: "#ca8a04", icon: "🍜" },
            { id: "ehime", name: "愛媛県", dialect: "〜じゃけん・みかん絞り上げるぞ", color: "#ea580c", icon: "🍊" },
            { id: "kochi", name: "高知県", dialect: "〜ぜよ・鰹のたたきにするぞ", color: "#9333ea", icon: "🐟" },
            { id: "fukuoka", name: "福岡県", dialect: "〜とっと・なめとんしゃあ", color: "#db2777", icon: "🍜" },
            { id: "saga", name: "佐賀県", dialect: "〜ばい・何しとっとか", color: "#16a34a", icon: "🎈" },
            { id: "nagasaki", name: "長崎県", dialect: "〜ばってん・ちゃんぽん麺にするぞ", color: "#2563eb", icon: "⛪" },
            { id: "kumamoto", name: "熊本県", dialect: "〜だモン・馬刺しにするぞ", color: "#e11d48", icon: "🐴" },
            { id: "oita", name: "大分県", dialect: "〜ちゃ・地獄温泉沈めるぞ", color: "#d97706", icon: "♨️" },
            { id: "miyazaki", name: "宮崎県", dialect: "〜ちょる・日向灘に放り込むぞ", color: "#14b8a6", icon: "🌴" },
            { id: "kagoshima", name: "鹿児島県", dialect: "〜じゃっど・桜島爆発させるぞ", color: "#c084fc", icon: "🌋" },
            { id: "okinawa", name: "沖縄県", dialect: "〜さぁ・てーげーすんなよ", color: "#0d9488", icon: "🌺" }
        ];

        let chatHistory = [];
        let base64Image = null;

        const messageList = document.getElementById('messageList');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const removeImageBtn = document.getElementById('removeImageBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const typingText = document.getElementById('typingText');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const customModal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        function showAlert(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            customModal.classList.remove('hidden');
        }
        modalCloseBtn.addEventListener('click', () => customModal.classList.add('hidden'));

        clearChatBtn.addEventListener('click', () => {
            messageList.innerHTML = '';
            chatHistory = [];
            showAlert("クリア", "チャット履歴を初期化しました。");
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (uploadEvent) => {
                    base64Image = uploadEvent.target.result.split(',')[1];
                    imagePreview.src = uploadEvent.target.result;
                    imagePreviewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        removeImageBtn.addEventListener('click', () => {
            base64Image = null;
            imageInput.value = '';
            imagePreviewContainer.classList.add('hidden');
        });

        function appendMessage(senderName, senderIcon, senderColor, text, imageUrl = null, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'} items-start space-x-2 animate-fadeIn`;

            if (!isUser) {
                const avatar = document.createElement('div');
                avatar.className = 'w-9 h-9 rounded-full flex items-center justify-center text-lg shrink-0 shadow-md border border-red-700/80';
                avatar.style.backgroundColor = '#1a0202';
                avatar.innerHTML = senderIcon;
                messageDiv.appendChild(avatar);
            }

            const contentWrapper = document.createElement('div');
            contentWrapper.className = `max-w-[80%] sm:max-w-[70%] flex flex-col ${isUser ? 'items-end' : 'items-start'}`;

            if (!isUser) {
                const nameLabel = document.createElement('span');
                nameLabel.className = 'text-[11px] font-bold mb-1 ml-1 text-red-200 flex items-center gap-1';
                nameLabel.innerHTML = `<span style="color:${senderColor}; font-size:1.1em;">●</span> ${senderName}`;
                contentWrapper.appendChild(nameLabel);
            }

            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl px-4 py-2.5 text-sm shadow-xl ${
                isUser 
                    ? 'bg-gradient-to-r from-red-800 to-red-700 text-white rounded-tr-none border border-red-600' 
                    : 'bg-[#210303]/95 border border-red-800/80 text-red-100 rounded-tl-none backdrop-blur-sm'
            }`;

            if (imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                img.className = 'rounded-lg mb-2 max-h-48 w-auto object-cover border border-red-900';
                bubble.appendChild(img);
            }

            if (text) {
                const textNode = document.createElement('p');
                textNode.className = 'whitespace-pre-wrap leading-relaxed';
                textNode.textContent = text;
                bubble.appendChild(textNode);
            }

            contentWrapper.appendChild(bubble);
            messageDiv.appendChild(contentWrapper);

            if (isUser) {
                const userAvatar = document.createElement('div');
                userAvatar.className = 'w-9 h-9 rounded-full bg-red-900 border border-red-600 flex items-center justify-center text-sm shrink-0 shadow-md text-white font-bold';
                userAvatar.innerHTML = '👤';
                messageDiv.appendChild(userAvatar);
            }

            messageList.appendChild(messageDiv);
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        async function generatePrefectureComplaints(userText, base64ImgData) {
            typingIndicator.classList.remove('hidden');
            typingText.textContent = "メッセージや画像を観察して、関連する都道府県たちが怒りを蓄積中...";

            const systemPrompt = `あなたは日本の47都道府県そのものが集まる激辛文句AIグループチャットです。

【超重要ルール】
1. 「九州」「東北」「関東」「四国」「中国地方」のような【地方名】やブロック名は一切禁止です！発言は必ず実在する47都道府県（例: 東京都、香川県、大阪府、北海道、福岡県など）の【公式都道府県名】のみで行ってください。
2. ユーザーの送信したテキストや画像（名物、観光地、言葉、食べ物、シチュエーションなど）をしっかりと観察し、その内容に**最も深く関連する都道府県（1〜2都道府県）を最優先で必ず選出**してください。
3. さらに、そのテーマにツッコミや文句を入れたい**他の都道府県**もランダムに織り交ぜて、合計で【1〜5つ】の都道府県を選出してください。
4. 各都道府県キャラクターは、地元の**ローカル方言**をフル活用し、強烈で毒舌な文句やツッコミを入れてください。

出力は、厳密に以下のJSON配列のみを返してください。マークダウンや余計な文章は絶対に含めないでください。

[
  {
    "prefectureId": "都道府県のid（例: tokyo, osaka, hokkaido, kagawa, ehime, fukuokaなど）",
    "complaintText": "ユーザーの投稿内容・画像を踏まえた、方言全開のボロクソ激辛ツッコミ・文句"
  }
]`;

            let userContentParts = [{ text: userText || "（画像のみ送信）" }];
            if (base64ImgData) {
                userContentParts.push({
                    inlineData: {
                        mimeType: "image/jpeg",
                        data: base64ImgData
                    }
                });
            }

            const payload = {
                contents: [
                    { role: "user", parts: [{ text: systemPrompt }] },
                    ...chatHistory,
                    { role: "user", parts: userContentParts }
                ],
                generationConfig: {
                    responseMimeType: "application/json"
                }
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=AQ.Ab8RN6IfiTYuAk4I_Lb21DZ5V5OyOHbguayM0RVzQroVOBvKXA`;

            try {
                let response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const jsonText = candidate.content.parts[0].text;
                    const parsedResponses = JSON.parse(jsonText);

                    chatHistory.push({ role: "user", parts: userContentParts });

                    for (const item of parsedResponses) {
                        const pref = PREFECTURES.find(p => p.id === item.prefectureId) || PREFECTURES[Math.floor(Math.random()*PREFECTURES.length)];
                        appendMessage(pref.name + "AI", pref.icon, pref.color, item.complaintText);
                        
                        chatHistory.push({
                            role: "model",
                            parts: [{ text: `${pref.name}: ${item.complaintText}` }]
                        });
                        
                        await new Promise(r => setTimeout(r, 450));
                    }
                } else {
                    throw new Error("Invalid model response structure");
                }
            } catch (error) {
                console.error(error);
                const count = Math.floor(Math.random() * 3) + 1;
                const selected = [...PREFECTURES].sort(() => 0.5 - Math.random()).slice(0, count);
                selected.forEach(pref => {
                    appendMessage(pref.name + "AI", pref.icon, pref.color, `なになに？血迷っとんのか！何言おうとボロクソに言ったるからな、${pref.dialect}！`);
                });
            } finally {
                typingIndicator.classList.add('hidden');
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text && !base64Image) return;

            let currentImg = base64Image ? `data:image/jpeg;base64,${base64Image}` : null;
            appendMessage("あなた", "👤", "#fff", text, currentImg, true);

            const imgToSend = base64Image;
            userInput.value = '';
            base64Image = null;
            imageInput.value = '';
            imagePreviewContainer.classList.add('hidden');

            await generatePrefectureComplaints(text, imgToSend);
        });
